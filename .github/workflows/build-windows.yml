name: Build Windows Installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: printer-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: 2022
      IMENU_SYNC_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iMenu sync token
        id: verify_sync_token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "IMENU_SYNC_TOKEN is missing from metrix0/imenu-printer Actions secrets."
          }

          $canPush = gh api repos/metrix0/imenu --jq ".permissions.push"
          Write-Host "Effective push permission to metrix0/imenu: $canPush"
          if ($canPush -ne "true") {
            throw "IMENU_SYNC_TOKEN is present, but GitHub reports push=false for metrix0/imenu."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore 1.0.8 baseline for retry
        if: ${{ contains(github.event.head_commit.message, '[retry-1.0.9]') }}
        shell: pwsh
        run: npm version 1.0.8 --no-git-tag-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
          python --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Increment version
        shell: pwsh
        run: |
          $current = node -p "require('./package.json').version"
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $patch++
          if ($patch -gt 9) {
            $patch = 0
            $minor++
          }
          if ($minor -gt 9) {
            $minor = 0
            $major++
          }

          $next = "$major.$minor.$patch"
          npm version $next --no-git-tag-version
          "VERSION=$next" >> $env:GITHUB_ENV

      - name: Build or reuse installer release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"

          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            gh release download $tag --pattern $fileName --dir "dist" --clobber
          }
          else {
            npm run dist -- --publish always
          }

          gh release edit $tag --draft=false

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: imenu-printer-${{ env.VERSION }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Sync installer and metadata to iMenu preview
        id: sync_preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"
          $source = Join-Path "dist" $fileName

          if (-not (Test-Path $source)) {
            throw "Installer not found: $source"
          }

          # Upload the EXE directly as a Git blob. This bypasses cross-repo git push/auth/pack issues.
          $blobPayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-exe-blob.json"
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($source))
          $blobPayload = '{"content":"' + $base64 + '","encoding":"base64"}'
          [IO.File]::WriteAllText($blobPayloadPath, $blobPayload, [Text.UTF8Encoding]::new($false))
          $exeBlobSha = gh api --method POST repos/metrix0/imenu/git/blobs --input $blobPayloadPath --jq ".sha"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($exeBlobSha)) {
            throw "Could not upload installer blob to metrix0/imenu."
          }
          Remove-Item $blobPayloadPath -Force
          Remove-Variable base64

          $metadata = [ordered]@{
            version = $env:VERSION
            updatedAt = (Get-Date).ToUniversalTime().ToString("o")
            downloadUrl = "/downloads/$([uri]::EscapeDataString($fileName))"
          } | ConvertTo-Json

          $metadataPayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-metadata-blob.json"
          $metadataPayload = @{
            content = $metadata
            encoding = "utf-8"
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($metadataPayloadPath, $metadataPayload, [Text.UTF8Encoding]::new($false))
          $metadataBlobSha = gh api --method POST repos/metrix0/imenu/git/blobs --input $metadataPayloadPath --jq ".sha"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($metadataBlobSha)) {
            throw "Could not upload printer metadata blob to metrix0/imenu."
          }
          Remove-Item $metadataPayloadPath -Force

          $synced = $false
          $lastError = ""

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $baseCommit = gh api repos/metrix0/imenu/git/ref/heads/preview --jq ".object.sha"
            if ($LASTEXITCODE -ne 0) { throw "Could not read iMenu preview ref." }

            $baseTree = gh api "repos/metrix0/imenu/git/commits/$baseCommit" --jq ".tree.sha"
            if ($LASTEXITCODE -ne 0) { throw "Could not read iMenu preview tree." }

            $treePayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-tree.json"
            $treePayload = @{
              base_tree = $baseTree
              tree = @(
                @{
                  path = "public/downloads/$fileName"
                  mode = "100644"
                  type = "blob"
                  sha = $exeBlobSha
                },
                @{
                  path = "public/downloads/imenu-printer.json"
                  mode = "100644"
                  type = "blob"
                  sha = $metadataBlobSha
                }
              )
            } | ConvertTo-Json -Depth 6 -Compress
            [IO.File]::WriteAllText($treePayloadPath, $treePayload, [Text.UTF8Encoding]::new($false))
            $newTree = gh api --method POST repos/metrix0/imenu/git/trees --input $treePayloadPath --jq ".sha"
            Remove-Item $treePayloadPath -Force
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($newTree)) {
              throw "Could not create iMenu preview tree."
            }

            $commitPayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-commit.json"
            $commitPayload = @{
              message = "chore: update printer download to $env:VERSION"
              tree = $newTree
              parents = @($baseCommit)
            } | ConvertTo-Json -Depth 4 -Compress
            [IO.File]::WriteAllText($commitPayloadPath, $commitPayload, [Text.UTF8Encoding]::new($false))
            $newCommit = gh api --method POST repos/metrix0/imenu/git/commits --input $commitPayloadPath --jq ".sha"
            Remove-Item $commitPayloadPath -Force
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($newCommit)) {
              throw "Could not create iMenu preview commit."
            }

            $refPayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-ref.json"
            $refPayload = @{
              sha = $newCommit
              force = $false
            } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText($refPayloadPath, $refPayload, [Text.UTF8Encoding]::new($false))

            $refOutput = gh api --method PATCH repos/metrix0/imenu/git/refs/heads/preview --input $refPayloadPath 2>&1
            $refCode = $LASTEXITCODE
            Remove-Item $refPayloadPath -Force

            if ($refCode -eq 0) {
              $synced = $true
              break
            }

            $lastError = ($refOutput | Out-String).Trim()
            Write-Host "Preview moved while syncing; retrying ($attempt/5)."
            Start-Sleep -Seconds (2 * $attempt)
          }

          if (-not $synced) {
            $summary = ($lastError -replace '[\r\n]+', ' ')
            if ($summary.Length -gt 110) { $summary = $summary.Substring(0, 110) }
            "error=$summary" >> $env:GITHUB_OUTPUT
            throw "Could not update iMenu preview ref after 5 attempts. $summary"
          }

          "error=" >> $env:GITHUB_OUTPUT

      - name: Save version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump printer version to $env:VERSION"
            git push
          }

      - name: Report sync result
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Set-PhaseStatus($context, $outcome, $description) {
            $state = if ($outcome -eq "success") { "success" } else { "failure" }
            if ([string]::IsNullOrWhiteSpace($description)) { $description = $outcome }
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
              -f "state=$state" `
              -f "context=$context" `
              -f "description=$description"
          }

          Set-PhaseStatus "printer-sync-token" "${{ steps.verify_sync_token.outcome }}" "${{ steps.verify_sync_token.outcome }}"
          Set-PhaseStatus "printer-release" "${{ steps.release.outcome }}" "${{ steps.release.outcome }}"
          Set-PhaseStatus "printer-preview-sync" "${{ steps.sync_preview.outcome }}" "${{ steps.sync_preview.outputs.error }}"

name: Build Windows Installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printer-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: 2022
      IMENU_SYNC_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iMenu sync token
        if: ${{ env.IMENU_SYNC_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          $canPush = gh api repos/metrix0/imenu --jq ".permissions.push"
          Write-Host "Effective push permission to metrix0/imenu: $canPush"
          if ($canPush -ne "true") {
            throw "IMENU_SYNC_TOKEN is present, but GitHub reports push=false for metrix0/imenu."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
          python --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Increment version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $versions = @($packageVersion)

          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            $version = $release.tagName -replace '^v', ''
            if ($version -match '^\d+\.\d+\.\d+$') {
              $versions += $version
            }
          }

          $current = $versions | Sort-Object -Descending -Property @{ Expression = {
            $p = $_.Split('.')
            ([int]$p[0] * 100) + ([int]$p[1] * 10) + [int]$p[2]
          }} | Select-Object -First 1

          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $patch++
          if ($patch -gt 9) {
            $patch = 0
            $minor++
          }
          if ($minor -gt 9) {
            $minor = 0
            $major++
          }

          $next = "$major.$minor.$patch"
          npm version $next --no-git-tag-version
          "VERSION=$next" >> $env:GITHUB_ENV

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist -- --publish always

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$env:VERSION" --draft=false

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: imenu-printer-${{ env.VERSION }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Save version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump printer version to $env:VERSION"
          git push

      - name: Checkout iMenu preview
        if: ${{ env.IMENU_SYNC_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: metrix0/imenu
          ref: preview
          token: ${{ secrets.IMENU_SYNC_TOKEN }}
          path: imenu-preview
          fetch-depth: 0
          persist-credentials: false

      - name: Configure iMenu push authentication
        if: ${{ env.IMENU_SYNC_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          Push-Location "imenu-preview"
          gh auth setup-git
          git remote set-url origin https://github.com/metrix0/imenu.git
          Pop-Location

      - name: Sync installer to iMenu preview
        if: ${{ env.IMENU_SYNC_TOKEN != '' }}
        shell: pwsh
        run: |
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"
          $source = Join-Path "dist" $fileName
          $targetDir = Join-Path "imenu-preview" "public/downloads"
          $target = Join-Path $targetDir $fileName

          if (-not (Test-Path $source)) {
            throw "Installer not found: $source"
          }

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item $source $target -Force

          $metadata = [ordered]@{
            version = $env:VERSION
            updatedAt = (Get-Date).ToUniversalTime().ToString("o")
            downloadUrl = "/downloads/$([uri]::EscapeDataString($fileName))"
          } | ConvertTo-Json

          Set-Content -Path (Join-Path $targetDir "imenu-printer.json") -Value $metadata -Encoding utf8NoBOM

          Push-Location "imenu-preview"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/downloads/$fileName" "public/downloads/imenu-printer.json"
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update printer download to $env:VERSION"

            $pushed = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              git fetch origin preview
              git rebase origin/preview

              if ($LASTEXITCODE -ne 0) {
                throw "Could not rebase printer download update onto the latest preview branch."
              }

              git push origin HEAD:preview
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }

              Start-Sleep -Seconds (2 * $attempt)
            }

            if (-not $pushed) {
              throw "Could not push printer download update to preview after 5 attempts."
            }
          }

          Pop-Location

      - name: Preview sync not configured
        if: ${{ env.IMENU_SYNC_TOKEN == '' }}
        shell: pwsh
        run: Write-Warning "IMENU_SYNC_TOKEN is not configured; skipping iMenu preview download sync."

name: Build Windows Installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: printer-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: 2022
      IMENU_SYNC_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iMenu sync token
        id: verify_sync_token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "IMENU_SYNC_TOKEN is missing from metrix0/imenu-printer Actions secrets."
          }

          $canPush = gh api repos/metrix0/imenu --jq ".permissions.push"
          Write-Host "Effective push permission to metrix0/imenu: $canPush"
          if ($canPush -ne "true") {
            throw "IMENU_SYNC_TOKEN is present, but GitHub reports push=false for metrix0/imenu."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore 1.0.8 baseline for retry
        if: ${{ contains(github.event.head_commit.message, '[retry-1.0.9]') }}
        shell: pwsh
        run: npm version 1.0.8 --no-git-tag-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
          python --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Increment version
        shell: pwsh
        run: |
          $current = node -p "require('./package.json').version"
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $patch++
          if ($patch -gt 9) {
            $patch = 0
            $minor++
          }
          if ($minor -gt 9) {
            $minor = 0
            $major++
          }

          $next = "$major.$minor.$patch"
          npm version $next --no-git-tag-version
          "VERSION=$next" >> $env:GITHUB_ENV

      - name: Build or reuse installer release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"

          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            gh release download $tag --pattern $fileName --dir "dist" --clobber
          }
          else {
            npm run dist -- --publish always
          }

          gh release edit $tag --draft=false

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: imenu-printer-${{ env.VERSION }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Trigger and verify iMenu preview sync
        id: sync_preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"
          $encodedFileName = [uri]::EscapeDataString($fileName)
          $releaseUrl = "https://github.com/metrix0/imenu-printer/releases/download/v$env:VERSION/$encodedFileName"
          $updatedAt = (Get-Date).ToUniversalTime().ToString("o")

          $trigger = [ordered]@{
            version = $env:VERSION
            updatedAt = $updatedAt
            releaseUrl = $releaseUrl
          } | ConvertTo-Json -Compress

          $triggerPayloadPath = Join-Path $env:RUNNER_TEMP "imenu-printer-trigger-blob.json"
          $triggerPayload = @{
            content = $trigger
            encoding = "utf-8"
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($triggerPayloadPath, $triggerPayload, [Text.UTF8Encoding]::new($false))
          $triggerBlob = gh api --method POST repos/metrix0/imenu/git/blobs --input $triggerPayloadPath --jq ".sha"
          Remove-Item $triggerPayloadPath -Force
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($triggerBlob)) {
            "error=could not create preview trigger blob" >> $env:GITHUB_OUTPUT
            throw "Could not create iMenu preview trigger blob."
          }

          $queued = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $baseCommit = gh api repos/metrix0/imenu/git/ref/heads/preview --jq ".object.sha"
            if ($LASTEXITCODE -ne 0) {
              "error=could not read preview ref" >> $env:GITHUB_OUTPUT
              throw "Could not read iMenu preview ref."
            }

            $baseTree = gh api "repos/metrix0/imenu/git/commits/$baseCommit" --jq ".tree.sha"
            if ($LASTEXITCODE -ne 0) {
              "error=could not read preview tree" >> $env:GITHUB_OUTPUT
              throw "Could not read iMenu preview tree."
            }

            $treePath = Join-Path $env:RUNNER_TEMP "imenu-printer-trigger-tree.json"
            $treePayload = @{
              base_tree = $baseTree
              tree = @(
                @{
                  path = ".printer-release-trigger.json"
                  mode = "100644"
                  type = "blob"
                  sha = $triggerBlob
                }
              )
            } | ConvertTo-Json -Depth 5 -Compress
            [IO.File]::WriteAllText($treePath, $treePayload, [Text.UTF8Encoding]::new($false))
            $newTree = gh api --method POST repos/metrix0/imenu/git/trees --input $treePath --jq ".sha"
            Remove-Item $treePath -Force
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($newTree)) {
              "error=could not create preview trigger tree" >> $env:GITHUB_OUTPUT
              throw "Could not create iMenu preview trigger tree."
            }

            $commitPath = Join-Path $env:RUNNER_TEMP "imenu-printer-trigger-commit.json"
            $commitPayload = @{
              message = "chore: queue printer download $env:VERSION"
              tree = $newTree
              parents = @($baseCommit)
            } | ConvertTo-Json -Depth 4 -Compress
            [IO.File]::WriteAllText($commitPath, $commitPayload, [Text.UTF8Encoding]::new($false))
            $newCommit = gh api --method POST repos/metrix0/imenu/git/commits --input $commitPath --jq ".sha"
            Remove-Item $commitPath -Force
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($newCommit)) {
              "error=could not create preview trigger commit" >> $env:GITHUB_OUTPUT
              throw "Could not create iMenu preview trigger commit."
            }

            $refPath = Join-Path $env:RUNNER_TEMP "imenu-printer-trigger-ref.json"
            $refPayload = @{
              sha = $newCommit
              force = $false
            } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText($refPath, $refPayload, [Text.UTF8Encoding]::new($false))
            gh api --method PATCH repos/metrix0/imenu/git/refs/heads/preview --input $refPath > $null 2>&1
            $refCode = $LASTEXITCODE
            Remove-Item $refPath -Force

            if ($refCode -eq 0) {
              $queued = $true
              break
            }

            Start-Sleep -Seconds (2 * $attempt)
          }

          if (-not $queued) {
            "error=could not advance preview ref with trigger" >> $env:GITHUB_OUTPUT
            throw "Could not queue iMenu preview trigger after 5 attempts."
          }

          $synced = $false
          for ($attempt = 1; $attempt -le 48; $attempt++) {
            Start-Sleep -Seconds 5

            $metadataContent = gh api "repos/metrix0/imenu/contents/public/downloads/imenu-printer.json?ref=preview" --jq ".content" 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($metadataContent)) {
              continue
            }

            try {
              $cleanBase64 = $metadataContent -replace '\s', ''
              $metadataText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($cleanBase64))
              $metadata = $metadataText | ConvertFrom-Json
            }
            catch {
              continue
            }

            if ($metadata.version -ne $env:VERSION) {
              continue
            }

            $exeSize = gh api "repos/metrix0/imenu/contents/public/downloads/$encodedFileName?ref=preview" --jq ".size" 2>$null
            if ($LASTEXITCODE -eq 0 -and [int64]$exeSize -gt 1000000) {
              $synced = $true
              break
            }
          }

          if (-not $synced) {
            "error=iMenu preview did not publish the EXE within 4 minutes" >> $env:GITHUB_OUTPUT
            throw "iMenu preview did not publish $fileName within 4 minutes."
          }

          "error=" >> $env:GITHUB_OUTPUT

      - name: Save version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump printer version to $env:VERSION"
            git push
          }

      - name: Report sync result
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Set-PhaseStatus($context, $outcome, $description) {
            $state = if ($outcome -eq "success") { "success" } else { "failure" }
            if ([string]::IsNullOrWhiteSpace($description)) { $description = $outcome }
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
              -f "state=$state" `
              -f "context=$context" `
              -f "description=$description"
          }

          Set-PhaseStatus "printer-sync-token" "${{ steps.verify_sync_token.outcome }}" "${{ steps.verify_sync_token.outcome }}"
          Set-PhaseStatus "printer-release" "${{ steps.release.outcome }}" "${{ steps.release.outcome }}"
          Set-PhaseStatus "printer-preview-sync" "${{ steps.sync_preview.outcome }}" "${{ steps.sync_preview.outputs.error }}"

name: Temporary COM printer name fix

on:
  push:
    branches:
      - tmp-com-printer-name-fix
    paths:
      - .github/workflows/tmp-apply-com-printer-name-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-com-printer-name-fix

      - name: Apply minimal printer detection change
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.cjs')
          text = path.read_text(encoding='utf-8')

          old_windows = '''function listWindowsPrinters() {
              return new Promise(resolve => {
                  const cmd = `powershell -NoProfile -Command "Get-Printer | Select-Object -ExpandProperty Name"`

                  exec(cmd, (err, stdout) => {
                      if (err) {
                          resolve([])
                          return
                      }

                      const printers = stdout
                          .split(/\\r?\\n/)
                          .map(value => value.trim())
                          .filter(Boolean)
                          .map(name => ({
                              name,
                              type: 'windows-printer',
                          }))

                      resolve(printers)
                  })
              })
          }
          '''

          new_windows = '''function normalizeComPortName(value) {
              return String(value || '')
                  .trim()
                  .replace(/:$/, '')
                  .toUpperCase()
          }

          function listWindowsPrinters() {
              return new Promise(resolve => {
                  const cmd = `powershell -NoProfile -Command "Get-Printer | Select-Object Name,PortName | ConvertTo-Json -Compress"`

                  exec(cmd, (err, stdout) => {
                      if (err) {
                          resolve([])
                          return
                      }

                      try {
                          const raw = String(stdout || '').trim()
                          if (!raw) {
                              resolve([])
                              return
                          }

                          const parsed = JSON.parse(raw)
                          const rows = Array.isArray(parsed) ? parsed : [parsed]

                          resolve(rows
                              .map(printer => ({
                                  name: String(printer.Name || '').trim(),
                                  portName: String(printer.PortName || '').trim(),
                                  type: 'windows-printer',
                              }))
                              .filter(printer => printer.name))
                      } catch {
                          resolve([])
                      }
                  })
              })
          }
          '''

          old_detect = '''async function detectPrinters() {
              const config = readConfig()
              const detectedComPorts = await listComPorts()
              const detectedWindowsPrinters = await listWindowsPrinters()
          '''

          new_detect = '''async function detectPrinters() {
              const config = readConfig()
              const detectedWindowsPrinters = await listWindowsPrinters()
              const detectedComPorts = (await listComPorts()).map(port => {
                  const portName = normalizeComPortName(port.path)
                  const matchingPrinter = detectedWindowsPrinters.find(
                      printer => normalizeComPortName(printer.portName) === portName
                  )

                  if (!matchingPrinter) {
                      return port
                  }

                  return {
                      ...port,
                      friendlyName: matchingPrinter.name,
                  }
              })
          '''

          if old_windows not in text:
              raise SystemExit('Expected listWindowsPrinters block not found')
          if old_detect not in text:
              raise SystemExit('Expected detectPrinters block not found')

          text = text.replace(old_windows, new_windows, 1)
          text = text.replace(old_detect, new_detect, 1)
          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-apply-com-printer-name-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.cjs .github/workflows/tmp-apply-com-printer-name-fix.yml
          git commit -m "feat: identify COM ports by Windows printer name"
          git push origin HEAD:tmp-com-printer-name-fix

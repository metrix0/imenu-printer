name: Build Windows Installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: printer-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: 2022
      IMENU_SYNC_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iMenu sync token
        id: verify_sync_token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "IMENU_SYNC_TOKEN is missing from metrix0/imenu-printer Actions secrets."
          }

          $canPush = gh api repos/metrix0/imenu --jq ".permissions.push"
          Write-Host "Effective push permission to metrix0/imenu: $canPush"
          if ($canPush -ne "true") {
            throw "IMENU_SYNC_TOKEN is present, but GitHub reports push=false for metrix0/imenu."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore 1.0.8 baseline for retry
        if: ${{ contains(github.event.head_commit.message, '[retry-1.0.9]') }}
        shell: pwsh
        run: npm version 1.0.8 --no-git-tag-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
          python --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Increment version
        shell: pwsh
        run: |
          $current = node -p "require('./package.json').version"
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $patch++
          if ($patch -gt 9) {
            $patch = 0
            $minor++
          }
          if ($minor -gt 9) {
            $minor = 0
            $major++
          }

          $next = "$major.$minor.$patch"
          npm version $next --no-git-tag-version
          "VERSION=$next" >> $env:GITHUB_ENV

      - name: Build or reuse installer release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"

          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            gh release download $tag --pattern $fileName --dir "dist" --clobber
          }
          else {
            npm run dist -- --publish always
          }

          gh release edit $tag --draft=false

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: imenu-printer-${{ env.VERSION }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Checkout iMenu preview
        uses: actions/checkout@v4
        with:
          repository: metrix0/imenu
          ref: preview
          token: ${{ secrets.IMENU_SYNC_TOKEN }}
          path: imenu-preview
          fetch-depth: 0
          persist-credentials: false

      - name: Sync installer to iMenu preview
        id: sync_preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IMENU_SYNC_TOKEN }}
        run: |
          $fileName = "iMenu Impressora Setup $env:VERSION.exe"
          $source = Join-Path "dist" $fileName
          $targetDir = Join-Path "imenu-preview" "public/downloads"
          $target = Join-Path $targetDir $fileName

          if (-not (Test-Path $source)) {
            throw "Installer not found: $source"
          }

          Push-Location "imenu-preview"
          git remote set-url origin "https://metrix0:$env:GH_TOKEN@github.com/metrix0/imenu.git"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin preview
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch latest iMenu preview." }
          git reset --hard origin/preview
          Pop-Location

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item $source $target -Force

          $metadata = [ordered]@{
            version = $env:VERSION
            updatedAt = (Get-Date).ToUniversalTime().ToString("o")
            downloadUrl = "/downloads/$([uri]::EscapeDataString($fileName))"
          } | ConvertTo-Json

          Set-Content -Path (Join-Path $targetDir "imenu-printer.json") -Value $metadata -Encoding utf8NoBOM

          Push-Location "imenu-preview"
          git add "public/downloads/$fileName" "public/downloads/imenu-printer.json"
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update printer download to $env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Could not create iMenu preview download commit." }

            $pushed = $false
            $lastPushOutput = ""
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              if ($attempt -gt 1) {
                git fetch origin preview
                if ($LASTEXITCODE -ne 0) { throw "Could not refresh iMenu preview before retry." }
                git rebase origin/preview
                if ($LASTEXITCODE -ne 0) { throw "Could not rebase printer download update onto latest preview." }
              }

              $pushLines = git -c http.version=HTTP/1.1 push origin HEAD:preview 2>&1
              $pushCode = $LASTEXITCODE
              $lastPushOutput = ($pushLines | Out-String).Trim()
              Write-Host $lastPushOutput

              if ($pushCode -eq 0) {
                $pushed = $true
                break
              }

              Start-Sleep -Seconds (3 * $attempt)
            }

            if (-not $pushed) {
              $summary = ($lastPushOutput -replace '[\r\n]+', ' ')
              if ($summary.Length -gt 110) { $summary = $summary.Substring(0, 110) }
              "error=$summary" >> $env:GITHUB_OUTPUT
              throw "Could not push printer download update to preview after 5 attempts. $summary"
            }
          }

          "error=" >> $env:GITHUB_OUTPUT
          Pop-Location

      - name: Save version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump printer version to $env:VERSION"
            git push
          }

      - name: Report sync result
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Set-PhaseStatus($context, $outcome, $description) {
            $state = if ($outcome -eq "success") { "success" } else { "failure" }
            if ([string]::IsNullOrWhiteSpace($description)) { $description = $outcome }
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
              -f "state=$state" `
              -f "context=$context" `
              -f "description=$description"
          }

          Set-PhaseStatus "printer-sync-token" "${{ steps.verify_sync_token.outcome }}" "${{ steps.verify_sync_token.outcome }}"
          Set-PhaseStatus "printer-release" "${{ steps.release.outcome }}" "${{ steps.release.outcome }}"
          Set-PhaseStatus "printer-preview-sync" "${{ steps.sync_preview.outcome }}" "${{ steps.sync_preview.outputs.error }}"
